      <h2 style="font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:#ff7a1f;margin:32px 0 12px;font-family:ui-monospace,Menlo,monospace;font-weight:500">About</h2>
      <p style="margin:0">I'm an electrical engineering student at the University of Florida. I write bare-metal Rust firmware for Gator Motorsports' telemetry, research certified 3D perception for self-driving cars in the TEA Lab, and train manipulation policies on a sub-$300 robot arm I built.</p>
      <h2 style="font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:#ff7a1f;margin:32px 0 12px;font-family:ui-monospace,Menlo,monospace;font-weight:500">Experience</h2>
      <ul style="margin:0;padding-left:20px">
      <li style="margin:0 0 6px"><strong>Firmware Engineer</strong>, Gator Motorsports (Aug 2026 — Present): real-time telemetry in Rust, bare-metal on an NXP i.MX RT1176 over 1 Gbps Ethernet.</li>
      <li style="margin:0 0 6px"><strong>Undergraduate Researcher</strong>, TEA Lab, University of Florida (Oct 2026 — Present): certified, uncertainty-aware 3D perception; 32 models, ~120 B200 GPU-hours.</li>
      <li style="margin:0 0 6px"><strong>Software Engineer</strong>, Flash Translation Layer Project (Sep 2026 — Present): a C++17 FTL for SPI NAND, zero divergence over 100K differential operations.</li>
      <li style="margin:0 0 6px"><strong>Algorithm Developer &amp; Beta Tester</strong>, Pedro Pathing (Jun 2025 — Jan 2026)</li>
      <li style="margin:0 0 6px"><strong>Student Researcher</strong>, University of South Florida (Dec 2024 — Jan 2026)</li>
      <li style="margin:0 0 6px"><strong>Software Developer</strong>, Inc to Inc (Jun 2023 — Jul 2025)</li>
      </ul>
      <h2 style="font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:#ff7a1f;margin:32px 0 12px;font-family:ui-monospace,Menlo,monospace;font-weight:500">Projects</h2>
      <ul style="margin:0;padding-left:20px">
      <li style="margin:0 0 6px"><strong>TactileVLA-Edge</strong> &mdash; Imitation-learning policies on a sub-$300 SO-101 arm: 18/20 (ACT) and 16/20 (SmolVLA-450M), both solving a workspace cell held out of training.</li>
      <li style="margin:0 0 6px"><strong>Zer0Sh0t</strong> &mdash; 3rd Place, Best Overall, SwampHacks XII (141 teams, team of 4): a voice-controlled robot arm that turns spoken requests into pick, place and point actions with no task-specific training.</li>
      <li style="margin:0 0 6px"><strong>Lucid Dreams</strong> &mdash; Top 10 Finalist, Gator Hack V (team of 4): photoreal, life-size 3D people in Meta Quest passthrough. I built Court Side and the animated avatars.</li>
      <li style="margin:0 0 6px"><strong>Sixth Sense</strong> &mdash; An iOS navigation aid for blind and low-vision users; 3rd place, 2024 Congressional App Challenge.</li>
      <li style="margin:0 0 6px"><strong>Midnight · DECODE</strong> and <strong>Into the Deep</strong> &mdash; FTC competition code, including a 105-point autonomous that set the state record and tied the world record at the time.</li>
      <li style="margin:0 0 6px"><strong>RL LDPC Decoding</strong> &mdash; A deep Q-network LDPC decoder; evaluation sped up 1,100×.</li>
      </ul>
      <h2 style="font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:#ff7a1f;margin:32px 0 12px;font-family:ui-monospace,Menlo,monospace;font-weight:500">Leadership</h2>
      <p style="margin:0"><strong>FTC Team Captain &amp; Lead Programmer</strong>, Middleton Robotics (Aug 2023 — May 2026). Led a 15-member team to its first state title in 7 years and raised $33,000 as captain.</p>
      <h2 style="font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:#ff7a1f;margin:32px 0 12px;font-family:ui-monospace,Menlo,monospace;font-weight:500">Education</h2>
      <p style="margin:0">B.S. Electrical Engineering, University of Florida &mdash; May 2029. Minor in Computer Science. GPA 4.0.</p>
